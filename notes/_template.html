<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筆記標題｜課程讀書筆記站</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="../index.html">課程讀書筆記站</a>
    <a class="back-link" href="../index.html">← 回首頁</a>
  </div>
</header>

<main>
  <h1>筆記標題</h1>

  <section class="meta">
    <dl>
      <dt>來源</dt><dd>來源標題</dd>
      <dt>作者</dt><dd>作者姓名</dd>
      <dt>年份</dt><dd>YYYY</dd>
      <dt>原文</dt><dd><a href="https://example.com">原文連結</a></dd>
      <dt>閱讀日期</dt><dd>YYYY-MM-DD</dd>
    </dl>
  </section>

  <section class="summary">
    <h2>一句話摘要</h2>
    <p>2–3 句說明這篇在講什麼。</p>
  </section>

  <section class="key-points">
    <h2>重點整理</h2>
    <ol>
      <li>重點一</li>
      <li>重點二</li>
      <li>重點三</li>
    </ol>
  </section>

  <section class="reflection">
    <h2>我的心得</h2>
    <p>寫下自己的想法，以及與課程其他內容的連結。</p>
  </section>

  <section class="questions">
    <h2>待釐清問題</h2>
    <ul>
      <li>問題一</li>
    </ul>
  </section>

  <section class="references">
    <h2>參考資料</h2>
    <ul>
      <li><a href="https://example.com">參考來源一</a></li>
    </ul>
  </section>
</main>

<footer class="site-footer">
  <p>© 課程讀書筆記站｜內容為學習用途的個人整理</p>
</footer>

</body>
</html>
